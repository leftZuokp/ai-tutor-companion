name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: 构建与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: 构建验证（含 TypeScript strict 检查）
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
